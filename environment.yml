name: cerebral-buckling

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.10

  # core binary libraries (conda-forge)
  - vmtk=1.5.0
  - vtk=9.2.6
  - numpy
  - scipy
  - pandas

  # visualization (conda-forge)
  - pyvista
  - matplotlib
  - seaborn

  # statistics (conda-forge)
  - scikit-learn
  - statsmodels

  # pip-managed packages (installed via pip in this project)
  - pip
  - pip:
      - antspyx==0.5.4
      - nibabel==5.3.2
      - pymeshlab==2023.12.post3